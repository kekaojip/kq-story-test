name: Cleanup Test Novel

on:
  push:
    paths:
      - '.github/workflows/cleanup-test-novel.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove test novel content only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf '项目/规则维修员'
          rm -f '.active-book'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remove Rules Repairman test novel content" || exit 0
          git push
